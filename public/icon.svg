<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cofixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231B15" />
      <stop offset="100%" stop-color="#140F0C" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED9C4" />
      <stop offset="100%" stop-color="#C49A6C" />
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F4E37" />
      <stop offset="100%" stop-color="#4A3525" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#cofixBg)" />
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#C49A6C" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8" />
  
  <!-- Steam lines -->
  <path d="M 220 160 C 210 135, 230 115, 220 90" fill="none" stroke="#C49A6C" stroke-width="8" stroke-linecap="round" stroke-opacity="0.75" />
  <path d="M 256 150 C 246 125, 266 105, 256 80" fill="none" stroke="#EED9C4" stroke-width="9" stroke-linecap="round" stroke-opacity="0.85" />
  <path d="M 292 160 C 282 135, 302 115, 292 90" fill="none" stroke="#C49A6C" stroke-width="8" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Coffee Cup Body -->
  <path d="M 160 200 L 352 200 C 352 300, 320 335, 256 335 C 192 335, 160 300, 160 200 Z" fill="url(#cupGrad)" />
  
  <!-- Inner Coffee surface -->
  <ellipse cx="256" cy="205" rx="86" ry="18" fill="url(#coffeeGrad)" />
  <!-- Latte art heart -->
  <path d="M 256 215 C 248 205, 236 205, 236 212 C 236 218, 256 226, 256 226 C 256 226, 276 218, 276 212 C 276 205, 264 205, 256 215 Z" fill="#EED9C4" opacity="0.9" />

  <!-- Cup Handle -->
  <path d="M 346 225 C 388 225, 388 290, 338 295" fill="none" stroke="url(#cupGrad)" stroke-width="20" stroke-linecap="round" />

  <!-- Saucer -->
  <path d="M 140 348 C 190 365, 322 365, 372 348 C 380 345, 380 354, 370 358 C 320 376, 192 376, 142 358 C 132 354, 132 345, 140 348 Z" fill="#C49A6C" />

  <!-- Brand Typography -->
  <text x="256" y="430" font-family="'Poppins', system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="8" text-anchor="middle">COFIX</text>
  <text x="256" y="465" font-family="'Poppins', system-ui, sans-serif" font-size="16" font-weight="500" fill="#C49A6C" letter-spacing="3" text-anchor="middle">ESPRESSO &amp; BREW</text>
</svg>
